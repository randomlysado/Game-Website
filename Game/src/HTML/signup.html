<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="\src\style.css">
    <title> Game Website Project</title>
</head>

<body>
    <div id="Nav-Bar">
        <div id="Nav-bttns">
            <a id="navbttn" href="index.html">Home</a>
            <a id="navbttn" href="\src\HTML\leaderboard.html"> Leaderboard</a>
            <a id="navbttn" href="\src\HTML\game.html">Play</a>
        </div>
    </div>
    <div class="SignupBox">
        <h1 id="welcome">Welcome</h1>
        <div class="userinfo">
            <label for="email" id="emailLabel">
                Email:
                <input id="email" class="infoBox" type="text" spellcheck="false" placeholder="Enter Email">
            </label>
            <label for="username" class="userlabel">
                Username:
                <input id="username" class="infoBox" type="text" spellcheck="false" placeholder="Enter Username">
            </label>
            <label for="password" class="userlabel">
                Password:
                <input id="password" class="infoBox" type="password" spellcheck="false" placeholder="Enter Password"
                    autocomplete="new-password">
            </label>
            <label for="confirmpass" id="confirmlabel">
                Confirm Password:
                <input id="confirmpass" class="infoBox" type="password" spellcheck="false"
                    placeholder="Confirm Password">
            </label>
            <button id="submitbttn">Register</button>
        </div>
        <a id="modeSwitch">Not new here? Click me!</a>
        <a id="forgot">Forgot Password?</a>
        <label id="errormsg">nothing</label>
    </div>
    <script src="/src/JavaScript/accountControl.js"></script>
    <script src="/src/JavaScript/login.js"></script>
</body>

</html>
