<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>Account Setting</title>
</head>

<body>
    <div id="Nav-Bar">
        <div id="Nav-bttns">
            <a id="navbttn" href="index.html">Home</a>
            <a id="navbttn" href="\src\HTML\leaderboard.html"> Leaderboard</a>
            <a id="navbttn" href="\src\HTML\game.html">Play</a>
        </div>
    </div>
    <div class="settingsContainer">
        <h1 id="welcome">Settings</h1>
        <label for="email" id="emailLabel">
            Email:
            <input id="email" class="infoBox" type="text" spellcheck="false" placeholder="Enter Email">
        </label>
        <label for="username" class="userlabel">
            Username:
            <input id="username" class="infoBox" type="text" spellcheck="false" placeholder="Enter Username">
        </label>
        <label for="password" class="userlabel">
            Password:
            <input id="password" class="infoBox" type="password" spellcheck="false" placeholder="Enter Password">
            <input id="viewPass" type="checkbox">
        </label>
        <label for="newPassword" id="newPasswordlabel">
            New Password:
            <input id="newPassword" class="infoBox" type="password" spellcheck="false" placeholder="Enter New Password">
        </label>
        <div>
            <button id="submitbttn">Save Changes</button>
            <button id="resetbttn">Reset</button>
        </div>
        <label id="msg">nothing</label>
    </div>
    <script src="/src/JavaScript/settings.js"></script>
    <script src="/src/JavaScript/accountControl.js"></script>



</body>

</html>
